name: Brouillon détaillé

# Rédige un article détaillé à partir d'un sujet de la veille et le dépose dans CE dépôt (data/brouillons/<id>.json),
# jamais dans le dépôt du journal. L'éditeur le récupère dans « Brouillons ». Rien n'est publié sur le site.
# Réglages d'IA (dont l'IA gratuite) : lus depuis l'onglet « IA » de l'éditeur (data/ia.json du journal, copie publique).
# Fournisseurs d'IA : onglet « IA » de l'éditeur. Clés : secrets du dépôt uniquement.

on:
  workflow_dispatch:
    inputs:
      ia_url:
        description: "Adresse des réglages d'IA (https)"
        required: false
      id:
        description: "Identifiant du sujet"
        required: true
      titre:
        description: "Titre du sujet"
        required: true
      url:
        description: "Adresse de la source (https)"
        required: false
      source:
        description: "Nom de la source"
        required: false
      resume:
        description: "Extrait"
        required: false
      rubrique:
        description: "Rubrique (numéro)"
        required: false
        default: "0"
      date:
        description: "Date de la source"
        required: false

permissions:
  contents: write

concurrency:
  group: redaction-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  rediger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les réglages d'IA
        env:
          IA_URL: ${{ inputs.ia_url }}
        run: |
          mkdir -p data
          case "$IA_URL" in https://*.github.io/*) curl -fsSL --max-time 20 "$IA_URL" -o data/ia.json || rm -f data/ia.json ;; esac
          true
      - name: Rédiger
        timeout-minutes: 9
        env:
          IA_BUDGET: "420"
          TOUS_SECRETS: ${{ toJSON(secrets) }}
          ID: ${{ inputs.id }}
          SRC_TITRE: ${{ inputs.titre }}
          SRC_URL: ${{ inputs.url }}
          SRC_SOURCE: ${{ inputs.source }}
          SRC_RESUME: ${{ inputs.resume }}
          SRC_RUBRIQUE: ${{ inputs.rubrique }}
          SRC_DATE: ${{ inputs.date }}
        run: python collecte/rediger.py
      - name: Signaler l'échec à l'éditeur
        if: failure()
        env:
          ID: ${{ inputs.id }}
        run: |
          python - <<'PY'
          import json, os, re, datetime
          i = re.sub(r"[^a-z0-9]", "", os.environ["ID"].lower())[:40]
          os.makedirs("data/brouillons", exist_ok=True)
          d = {"erreur": "Le script de rédaction a planté ou a dépassé 9 minutes (voir Actions > « Brouillon détaillé » > journal rouge).", "maj": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ")}
          open(f"data/brouillons/{i}.json", "w").write(json.dumps(d, ensure_ascii=False))
          PY
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "redaction-bot"
          git config user.email "redaction-bot@users.noreply.github.com"
          git add -A data/brouillons
          [ -f data/ia-etat.json ] && git add data/ia-etat.json || true
          git diff --staged --quiet && exit 0
          git commit -m "Brouillon détaillé"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" && git push && exit 0
            sleep $((RANDOM % 5 + 2))
          done
          exit 1
